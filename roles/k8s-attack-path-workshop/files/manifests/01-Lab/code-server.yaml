---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-server
  namespace: development
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-server-role
  namespace: development
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-server-rb
  namespace: development
subjects:
  - kind: ServiceAccount
    name: code-server
    namespace: development
roleRef:
  kind: Role
  name: code-server-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: code-server-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: code-server-namespace-reader-crb
subjects:
  - kind: ServiceAccount
    name: code-server
    namespace: development
roleRef:
  kind: ClusterRole
  name: code-server-namespace-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
    spec:
      serviceAccountName: code-server
      containers:
        - name: code-server
          image: docker.io/codercom/code-server:4.107.0-39
          args:
            - "--bind-addr"
            - "0.0.0.0:8080"
            - "--auth"
            - "password"
          env:
            - name: PASSWORD
              value: "PULITZER.saroyan.witness1!"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
