---
- name: "Wait for service account token for {{ kube_user.name }}"
  ansible.builtin.shell: |
    kubectl --kubeconfig=/tmp/admin.conf -n {{ kube_user.namespace }} \
      get secret {{ kube_user.name }}-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d
  register: sa_token
  retries: 90
  delay: 2
  until: sa_token.stdout | length > 0
  changed_when: false

- name: "Create user {{ kube_user.name }}"
  ansible.builtin.user:
    name: "{{ kube_user.name }}"
    shell: /bin/bash
    create_home: true
  register: user_created

- name: "Create .kube directory for {{ kube_user.name }}"
  ansible.builtin.file:
    path: "/home/{{ kube_user.name }}/.kube"
    state: directory
    owner: "{{ kube_user.name }}"
    group: "{{ kube_user.name }}"
    mode: "0755"

- name: "Generate kubeconfig for {{ kube_user.name }}"
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Config
      clusters:
      - name: specterops
        cluster:
          server: {{ k8s_server.stdout }}
          certificate-authority-data: {{ k8s_ca_data.stdout }}
      contexts:
      - name: {{ kube_user.name }}@specterops
        context:
          cluster: specterops
          namespace: {{ kube_user.namespace }}
          user: {{ kube_user.name }}
      current-context: {{ kube_user.name }}@specterops
      users:
      - name: {{ kube_user.name }}
        user:
          token: {{ sa_token.stdout }}
    dest: "/home/{{ kube_user.name }}/.kube/config"
    owner: "{{ kube_user.name }}"
    group: "{{ kube_user.name }}"
    mode: "0600"
